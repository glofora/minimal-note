<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Inner Note Paper Sheet with Shadow -->
  <g filter="url(#cardShadow)">
    <rect x="96" y="86" width="320" height="340" rx="36" fill="url(#sheetGrad)" />
  </g>

  <!-- Checkmark (Indigo) -->
  <path d="M160 200 L204 244 L276 172" fill="none" stroke="#4F46E5" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- First Line continuation -->
  <line x1="316" y1="186" x2="356" y2="186" stroke="#818CF8" stroke-width="22" stroke-linecap="round" />

  <!-- Second Line (Notes body) -->
  <line x1="160" y1="280" x2="356" y2="280" stroke="#94A3B8" stroke-width="22" stroke-linecap="round" />

  <!-- Third Line & Accent Dot -->
  <line x1="160" y1="344" x2="280" y2="344" stroke="#94A3B8" stroke-width="22" stroke-linecap="round" />
  <circle cx="334" cy="344" r="12" fill="#6366F1" />
</svg>
